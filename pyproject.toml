[project]
name = "supskill"
version = "0.7.0"
description = "supskill sprint conductor - supskill-state is its state spine"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
src = ["scripts", "tests"]
extend-include = ["scripts/supskill-state", "scripts/supskill-audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/supskill-state" = ["E402"]
"scripts/supskill-audit" = ["E402"]
